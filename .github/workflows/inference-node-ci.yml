name: Inference node verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inference-node-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ollama-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@v4

      - name: Select stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            target
          key: inference-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'architectures/inference-only/inference-node/Cargo.toml', 'shared/inference/Cargo.toml') }}

      - name: Reject training dependencies
        run: |
          cargo tree \
            -p psyche-inference-node \
            --no-default-features \
            --features ollama \
            -e normal > /tmp/inference-dependencies.txt
          if grep -E '(^| )(psyche-network|tch|torch-sys|pyo3) v' /tmp/inference-dependencies.txt; then
            echo "Ollama-only inference unexpectedly depends on the training runtime"
            exit 1
          fi

      - name: Test gateway request policy
        run: >-
          cargo test -p psyche-inference-node
          --no-default-features --features ollama
          --lib gateway::

      - name: Test lightweight P2P path
        run: |
          cargo test -p psyche-inference-node \
            --no-default-features --features ollama \
            --lib p2p::
          cargo test -p psyche-inference-node \
            --no-default-features --features ollama \
            --test p2p_ollama

      - name: Check gateway and Ollama node binaries
        run: |
          cargo check -p psyche-inference-node \
            --no-default-features --features ollama \
            --bin gateway-node
          cargo check -p psyche-inference-node \
            --no-default-features --features ollama \
            --bin psyche-inference-node

  windows-artifact:
    needs: ollama-only
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@v4

      - name: Select stable Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            target
          key: inference-windows-${{ hashFiles('Cargo.lock', 'architectures/inference-only/inference-node/Cargo.toml', 'shared/inference/Cargo.toml') }}

      - name: Test Ollama-only inference on Windows
        shell: pwsh
        run: |
          cargo test -p psyche-inference `
            --locked --no-default-features --features ollama `
            --release
          cargo test -p psyche-inference-node `
            --locked --no-default-features --features ollama `
            --release

      - name: Build Windows release binaries
        shell: pwsh
        run: |
          cargo build -p psyche-inference-node `
            --locked --no-default-features --features ollama `
            --release `
            --bin gateway-node `
            --bin psyche-inference-node

      - name: Package binaries and SHA-256
        shell: pwsh
        run: |
          $artifactDirectory = "inference-windows-x86_64"
          New-Item -ItemType Directory -Path $artifactDirectory | Out-Null
          $binaries = @(
            "gateway-node.exe",
            "psyche-inference-node.exe"
          )
          foreach ($binary in $binaries) {
            Copy-Item "target/release/$binary" $artifactDirectory
          }
          $hashLines = foreach ($binary in $binaries) {
            $hash = (Get-FileHash "$artifactDirectory/$binary" -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $binary"
          }
          Set-Content -Path "$artifactDirectory/SHA256SUMS.txt" `
            -Value $hashLines `
            -Encoding ascii
          Get-Content "$artifactDirectory/SHA256SUMS.txt"

      - name: Upload tested Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: inference-windows-x86_64-${{ github.sha }}
          path: inference-windows-x86_64
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
