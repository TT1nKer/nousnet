[package]
name = "psyche-inference-node"
version.workspace = true
edition = "2021"

[features]
default = ["vllm"]
vllm = ["psyche-inference/vllm", "dep:pyo3"]
ollama = ["psyche-inference/ollama"]

[[bin]]
name = "psyche-inference-node"
path = "src/main.rs"

[[bin]]
name = "test-network"
path = "src/bin/test-network.rs"

[[bin]]
name = "gateway-node"
path = "src/bin/gateway-node.rs"

[dependencies]
psyche-inference = { path = "../../../shared/inference", default-features = false }
psyche-network.workspace = true
psyche-metrics.workspace = true

tokio.workspace = true
tokio-util.workspace = true

anyhow.workspace = true

tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

clap.workspace = true
clap-markdown.workspace = true

iroh.workspace = true
iroh-blobs.workspace = true
iroh-gossip.workspace = true

reqwest = { version = "0.12", features = ["json"] }
rand.workspace = true
serde_json.workspace = true
serde.workspace = true
subtle = "2.6.1"
uuid = { version = "1", features = ["v4"] }
pyo3 = { workspace = true, optional = true }
postcard.workspace = true
axum = { version = "0.7", features = ["macros"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors"] }
tikv-jemallocator.workspace = true
zeroize = "1.8.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
  "Win32_System_Memory",
] }

[dev-dependencies]
tempfile = "3.25.0"
